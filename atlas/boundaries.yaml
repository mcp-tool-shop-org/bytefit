summary: ""
boundaries:
  - name: .github
    globs:
      - .github/**
    role: config
  - name: assets
    globs:
      - assets/**
    role: data
  - name: docs
    globs:
      - docs/**
    role: docs
  - name: root
    globs:
      - "*"
    role: config
  - name: site
    globs:
      - site/**
    role: site
  - name: src
    globs:
      - src/**
    role: code
